<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CampusFlow{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { ink: '#172033', brand: '#4f46e5' } } } }</script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <header class="sticky top-0 z-20 border-b border-slate-200 bg-white/95 backdrop-blur">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 sm:px-6">
      <a href="{{ url_for('dashboard.dashboard') }}" class="flex items-center gap-3 font-bold text-ink">
        <span class="grid h-9 w-9 place-items-center rounded-xl bg-indigo-600 text-lg text-white">C</span>
        <span>CampusFlow <span class="hidden font-normal text-slate-400 sm:inline">Resource Hub</span></span>
      </a>
      <nav class="flex items-center gap-1 text-sm font-medium">
        <a href="{{ url_for('dashboard.dashboard') }}" class="rounded-lg px-3 py-2 hover:bg-slate-100">Dashboard</a>
        <a href="{{ url_for('events.list_events') }}" class="rounded-lg px-3 py-2 hover:bg-slate-100">Events</a>
        <a href="{{ url_for('resources.list_resources') }}" class="rounded-lg px-3 py-2 hover:bg-slate-100">Resources</a>
        <a href="{{ url_for('requests.list_requests') }}" class="rounded-lg px-3 py-2 hover:bg-slate-100">Requests</a>
        <a href="{{ url_for('resources.availability') }}" class="hidden rounded-lg px-3 py-2 hover:bg-slate-100 md:block">Availability</a>
      </nav>
    </div>
  </header>
  <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}<div class="mb-6 space-y-2">{% for category, message in messages %}<div class="rounded-xl border px-4 py-3 text-sm {% if category == 'success' %}border-emerald-200 bg-emerald-50 text-emerald-800{% else %}border-rose-200 bg-rose-50 text-rose-800{% endif %}">{{ message }}</div>{% endfor %}</div>{% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
